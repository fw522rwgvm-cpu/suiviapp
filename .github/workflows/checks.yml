name: Verifications

# Types, tests and migration replay (D6/G4).
#
# Runs on Linux in about a minute, against every push and every branch,
# where the iOS build costs a fifteen-minute macOS runner. Anything that can
# fail here must fail here: a dependency conflict caught on Linux is a minute,
# the same conflict caught on macOS is a coffee.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict install from the lockfile, exactly as the iOS build does it.
      # This is the step that catches an inconsistent dependency tree, which
      # `npm install` is too permissive to notice.
      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run typecheck

      # Replays every migration against a real SQLite file in Node (D6/G4).
      - name: Tests
        run: npm test

      # Catches a schema edited without generating the matching migration.
      # Without this, the table exists in TypeScript and never on the device:
      # the application compiles, runs, and fails at the first query.
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain src/core/db/migrations)" ]; then
            echo "::error::Schema changed without a generated migration. Run: npx drizzle-kit generate"
            git status --porcelain src/core/db/migrations
            git diff -- src/core/db/migrations
            exit 1
          fi
